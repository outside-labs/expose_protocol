[project]
name = "expose-protocol"
version = "0.1.0"
description = "Expose local programs through validated macOS URL schemes."
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
expose-protocol = "expose_protocol:main"

[project.urls]
Source = "https://github.com/outside-labs/expose_protocol"
Issues = "https://github.com/outside-labs/expose_protocol/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
